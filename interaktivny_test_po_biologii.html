<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивный тест по биологии</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#18302a;background:#f3f7f4}
body{margin:0;padding:20px}
main{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #163c2415}
h1{margin-top:0;color:#176342}
button{border:0;border-radius:10px;padding:11px 16px;background:#176342;color:white;font-size:1rem;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{background:#e8f3ec;border-radius:20px;padding:5px 11px;font-size:.9rem}
.progress{height:8px;background:#e2ebe5;border-radius:10px;margin:16px 0}
#bar{height:100%;background:#36a568;border-radius:10px;width:0}
#visual{margin:16px auto;text-align:center}
svg{max-width:100%;height:auto;background:#fbfdfb;border:1px solid #e2ebe5;border-radius:12px}
.option{display:flex;gap:10px;align-items:flex-start;padding:11px;margin:8px 0;border:1px solid #d8e4dc;border-radius:10px;cursor:pointer}
.option:hover{background:#f3faf5}
.option input{margin-top:5px}
.explain{padding:14px;background:#eef7f0;border-left:4px solid #36a568;margin-top:16px;border-radius:8px}
.muted{color:#53645b}
#result{display:none}
table{border-collapse:collapse;width:100%;margin:15px 0}
td,th{border-bottom:1px solid #dbe5de;padding:9px;text-align:left}
.correct{color:#16723f}.wrong{color:#b32929}
@media(max-width:560px){body{padding:8px}main{padding:16px}}
</style>
</head>
<body>
<main>
<h1>Проверка знаний по биологии</h1>
<p class="muted">20 заданий · клетка, деление, размножение, генетика и изменчивость. В заданиях с множественным выбором отметьте все подходящие варианты.</p>

<section id="quiz">
<div class="top">
<span id="counter" class="badge"></span>
<span id="topic" class="badge"></span>
<span id="level" class="badge"></span>
</div>
<div class="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div id="visual"></div>
<p id="hint" class="muted"></p>
<div id="answers"></div>
<div class="row" style="margin-top:18px">
<button id="prev">← Назад</button>
<button id="next">Далее →</button>
<button id="finish" style="margin-left:auto">Завершить тест</button>
</div>
</section>

<section id="result">
<h2>Результаты</h2>
<div id="score"></div>
<h3>Результаты по темам</h3>
<div id="stats"></div>
<h3>Разбор заданий</h3>
<div id="review"></div>
<button onclick="location.reload()">Пройти заново</button>
</section>
</main>

<script>
const questions = [
{t:"Клетка",l:"Базовый",m:1,v:"cells",q:"На схеме показаны две эукариотические клетки. Выберите верные утверждения о клетке A.",o:["Клетка A имеет клеточную стенку из целлюлозы.","В клетке A есть крупная центральная вакуоль.","Клетка A — животная клетка, поскольку у неё есть ядро.","Хлоропласты участвуют в фотосинтезе."],a:[0,1,3],e:"Клетка A — растительная: клеточная стенка, крупная вакуоль и хлоропласты характерны для растительных клеток. Ядро есть и у животных, и у растений."},
{t:"Клетка",l:"Средний",m:1,q:"Выберите утверждения, верно отражающие клеточную теорию и различия клеток.",o:["Новые клетки возникают из ранее существовавших клеток.","Прокариотические клетки не имеют оформленного ядра.","У всех клеток есть митохондрии.","Клетка — элементарная структурная и функциональная единица живого.","У бактерий ДНК находится внутри ядерной оболочки."],a:[0,1,3],e:"Клеточная теория рассматривает клетку как единицу строения и функций организмов, а клетки — как происходящие от других клеток. У прокариот нет оформленного ядра; митохондрии есть не у всех клеток."},
{t:"Органоиды клетки",l:"Базовый",m:1,v:"organelles",q:"На схеме цифрами обозначены органоиды. Какие структуры непосредственно участвуют в синтезе и перемещении белков?",o:["1 — рибосомы","2 — шероховатая эндоплазматическая сеть","3 — аппарат Гольджи","4 — лизосома"],a:[0,1],e:"Рибосомы синтезируют белок, а шероховатая эндоплазматическая сеть участвует в его перемещении и первичной обработке."},
{t:"Органоиды клетки",l:"Средний",m:1,q:"Соотнесите органоид и его функцию. Выберите верную комбинацию.",o:["Митохондрия — синтез АТФ при клеточном дыхании; аппарат Гольджи — модификация и сортировка веществ.","Лизосома — фотосинтез; хлоропласт — внутриклеточное переваривание.","Рибосома — хранение наследственной информации; ядро — синтез липидов.","Вакуоль — синтез белка; клеточная стенка — образование АТФ."],a:[0],e:"Митохондрии участвуют в клеточном дыхании, аппарат Гольджи сортирует и упаковывает вещества. Остальные соответствия неверны."},
{t:"Ядро клетки",l:"Базовый",m:0,v:"nucleus",q:"Рассмотрите схему ядра. Как называется плотное округлое образование внутри ядра, обозначенное стрелкой?",o:["Ядрышко","Ядерная пора","Хроматида","Клеточный центр"],a:[0],e:"Ядрышко — область ядра, где образуются компоненты рибосом."},
{t:"Ядро клетки",l:"Средний",m:1,q:"Выберите верные утверждения о наследственном материале эукариотической клетки.",o:["Ген — участок ДНК, связанный с определённым продуктом или функцией.","Хроматин образован ДНК и белками.","Перед делением ДНК реплицируется в интерфазе.","Ядрышко отделено от цитоплазмы собственной мембраной.","При удвоении ДНК число хромосом сразу удваивается."],a:[0,1,2],e:"Гены — участки ДНК, а хроматин включает ДНК и белки. Репликация происходит в S-периоде интерфазы: количество ДНК увеличивается, но число хромосом до расхождения хроматид остаётся прежним."},
{t:"Катаболизм",l:"Базовый",m:1,v:"respiration",q:"На схеме показано клеточное дыхание. Выберите верные утверждения.",o:["Гликолиз происходит в цитоплазме.","Кислородный этап у эукариот связан с митохондриями.","Кислород является исходным веществом гликолиза.","Энергия части реакций запасается в АТФ.","При отсутствии кислорода гликолиз немедленно прекращается."],a:[0,1,3],e:"Гликолиз идёт в цитоплазме и может происходить без кислорода. Основные реакции кислородного этапа у эукариот связаны с митохондриями; часть энергии сохраняется в АТФ."},
{t:"Катаболизм",l:"Средний",m:0,q:"Расположите этапы энергетического обмена в типичном школьном описании полного окисления глюкозы.",f:"Последовательность",o:["Подготовительный этап → гликолиз → кислородный этап","Гликолиз → подготовительный этап → кислородный этап","Кислородный этап → гликолиз → подготовительный этап","Подготовительный этап → кислородный этап → гликолиз"],a:[0],e:"В школьной схеме сначала выделяют подготовительный этап, затем гликолиз, после него — кислородный этап."},
{t:"Митоз",l:"Базовый",m:1,v:"metaphase",q:"Какую фазу митоза показывает схема? Выберите утверждения, соответствующие изображённой фазе.",o:["Метафаза.","Хромосомы расположены в экваториальной плоскости клетки.","Сестринские хроматиды уже разошлись к полюсам.","Нити веретена деления связаны с областью центромер."],a:[0,1,3],e:"В метафазе хромосомы выстраиваются в экваториальной плоскости; нити веретена связаны с их центромерами. Расхождение хроматид происходит в анафазе."},
{t:"Митоз",l:"Средний",m:1,v:"anaphase",q:"Определите фазу на схеме и выберите верные утверждения.",o:["Это анафаза митоза.","Сестринские хроматиды расходятся к противоположным полюсам.","В каждой дочерней клетке после завершения деления обычно сохраняется исходный набор хромосом.","В этой фазе впервые происходит репликация ДНК."],a:[0,1,2],e:"В анафазе сестринские хроматиды расходятся к полюсам. Репликация ДНК происходит до митоза, в интерфазе."},
{t:"Митоз",l:"Повышенный",m:0,q:"В клетке организма с диплоидным набором 2n = 8 завершилась репликация ДНК. Каковы число хромосом и число молекул ДНК в одной клетке до начала анафазы?",o:["8 хромосом и 16 молекул ДНК","16 хромосом и 16 молекул ДНК","8 хромосом и 8 молекул ДНК","16 хромосом и 8 молекул ДНК"],a:[0],e:"После репликации каждая из 8 хромосом состоит из двух сестринских хроматид. Поэтому молекул ДНК 16, а хромосом до расхождения хроматид — 8."},
{t:"Мейоз",l:"Средний",m:1,v:"meiosis",q:"На схеме показано сближение гомологичных хромосом и обмен участками. Выберите верные утверждения.",o:["Процесс называется кроссинговером.","Он происходит в профазе I мейоза.","Он может приводить к новым сочетаниям аллелей.","Он уменьшает число хромосом вдвое непосредственно в момент обмена участками."],a:[0,1,2],e:"Кроссинговер происходит между гомологичными хромосомами в профазе I и создаёт новые сочетания аллелей. Сам обмен участками не является причиной редукции числа хромосом."},
{t:"Мейоз",l:"Повышенный",m:0,v:"meiosis2",q:"Какой итог соответствует одному мейотическому делению диплоидной исходной клетки при обычном ходе процесса?",o:["Две генетически одинаковые диплоидные клетки","Четыре клетки с гаплоидным набором хромосом","Одна клетка с удвоенным числом хромосом","Четыре генетически обязательно одинаковые клетки"],a:[1],e:"Обычно мейоз приводит к образованию четырёх гаплоидных клеток; их генетический материал различается вследствие рекомбинации и независимого расхождения хромосом."},
{t:"Размножение организмов",l:"Базовый",m:1,v:"reproduction",q:"На рисунках показаны почкование, образование семян и вегетативное размножение клубнями. Выберите верные утверждения.",o:["Почкование — форма бесполого размножения.","При размножении клубнями потомство обычно генетически близко к материнскому растению.","Оплодотворение обязательно при любом бесполом размножении.","Половое размножение связано с образованием и слиянием гамет."],a:[0,1,3],e:"Почкование и размножение клубнями — бесполые способы. Половое размножение связано с гаметами и оплодотворением; оно создаёт новые сочетания наследственного материала."},
{t:"Размножение организмов",l:"Средний",m:0,q:"Установите соответствие между способом размножения и его характеристикой. Выберите правильный вариант.",f:"Соответствие",o:["Партеногенез — развитие организма из неоплодотворённой яйцеклетки; вегетативное размножение — образование потомства из частей растения.","Партеногенез — слияние двух гамет; вегетативное размножение — образование спор только после мейоза.","Партеногенез — деление соматической клетки; вегетативное размножение — обязательное оплодотворение.","Партеногенез и вегетативное размножение всегда дают генетически идентичное потомство."],a:[0],e:"При партеногенезе развитие начинается из неоплодотворённой яйцеклетки; при вегетативном размножении новое растение развивается из вегетативной части."},
{t:"Законы Менделя",l:"Средний",m:1,v:"punnett",q:"У гороха жёлтая окраска семян доминирует над зелёной. Скрещивают два гетерозиготных растения. Выберите верные утверждения.",o:["Вероятность зелёных семян у потомка равна 1/4.","Вероятность жёлтых семян равна 3/4.","Потомки могут иметь два разных генотипа.","Все потомки будут гетерозиготными."],a:[0,1,2],e:"При скрещивании двух гетерозигот генотипическое соотношение составляет 1:2:1, а фенотипическое — 3:1 при полном доминировании. Поэтому потомки могут быть гомозиготными и гетерозиготными."},
{t:"Законы Менделя",l:"Базовый",m:1,q:"Аллель A полностью доминирует над аллелем a. Какие генотипы имеют доминантный фенотип?",o:["AA","Aa","aa","Только гетерозиготы"],a:[0,1],e:"При полном доминировании доминантный фенотип проявляется у генотипов AA и Aa."},
{t:"Законы Менделя",l:"Повышенный",m:0,v:"dihybrid",q:"При дигибридном скрещивании AaBb × AaBb гены наследуются независимо, доминирование полное. Какова вероятность потомка с рецессивным фенотипом по обоим признакам?",o:["1/4","1/8","1/16","3/16"],a:[2],e:"Вероятность рецессивного фенотипа по каждому признаку составляет 1/4. При независимом наследовании вероятности перемножаются: получается 1/16."},
{t:"Изменчивость",l:"Базовый",m:1,v:"variation",q:"На графике показано изменение распределения признака при разных условиях среды. Выберите верные утверждения о модификационной изменчивости.",o:["Она возникает под влиянием условий среды.","Обычно она не изменяет последовательность ДНК.","Её диапазон ограничен нормой реакции генотипа.","Любая модификация обязательно передаётся потомству."],a:[0,1,2],e:"Модификационная изменчивость связана с влиянием среды и нормой реакции; обычно она не меняет генотип и не наследуется как изменение ДНК."},
{t:"Изменчивость",l:"Повышенный",m:1,v:"mutation",q:"На схеме показаны исходная последовательность ДНК и вариант с заменой одного нуклеотида. Выберите верные утверждения.",o:["Это пример генной мутации.","Мутации могут возникать спонтанно или под действием мутагенов.","Мутация в клетке-предшественнице гамет может передаться потомству.","Любая мутация обязательно вредна для организма."],a:[0,1,2],e:"Замена нуклеотида — изменение последовательности ДНК. Последствия мутаций различны; наследоваться могут мутации, возникшие в клетках, дающих начало гаметам."}
];

};

let order = questions.map((_,i)=>i);
for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
const answers = {};
let pos=0;
const $=id=>document.getElementById(id);
function render(){
 const q=questions[order[pos]];
 $("counter").textContent=`Задание ${pos+1} из ${order.length}`;
 $("topic").textContent=q.t;
 $("level").textContent=`${q.l} уровень`;
 $("bar").style.width=`${pos/order.length*100}%`;
 $("question").textContent=q.q;
 $("hint").textContent=q.m?"Выберите все верные варианты.":"Выберите один вариант.";
 $("visual").innerHTML=q.v?visuals[q.v]:"";
 $("answers").innerHTML="";
 q.o.forEach((txt,i)=>{
  const lab=document.createElement("label");lab.className="option";
  const inp=document.createElement("input");inp.type=q.m?"checkbox":"radio";inp.name="ans";inp.value=i;
  inp.checked=(answers[order[pos]]||[]).includes(i);
  inp.onchange=()=>{
   if(q.m){let s=new Set(answers[order[pos]]||[]);inp.checked?s.add(i):s.delete(i);answers[order[pos]]=[...s]}
   else answers[order[pos]]=[i];
  };
  lab.append(inp,document.createTextNode(txt));$("answers").append(lab);
 });
 $("prev").disabled=pos===0;
 $("next").textContent=pos===order.length-1?"К результатам →":"Далее →";
}
$("prev").onclick=()=>{if(pos>0){pos--;render()}};
$("next").onclick=()=>{if(pos<order.length-1){pos++;render()}else finish()};
$("finish").onclick=finish;

function finish(){
 let right=0, by={};
 questions.forEach((q,i)=>{
  const got=(answers[i]||[]).slice().sort((a,b)=>a-b);
  const key=q.a.slice().sort((a,b)=>a-b);
  const ok=got.length===key.length&&got.every((x,j)=>x===key[j]);
  if(ok)right++;
  if(!by[q.t])by[q.t]={n:0,total:0};
  by[q.t].total++;if(ok)by[q.t].n++;
 });
 $("quiz").style.display="none";$("result").style.display="block";
 $("score").innerHTML=`<p><b>${right} из ${questions.length}</b> · ${Math.round(right/questions.length*100)}% правильных ответов.</p>`;
 $("stats").innerHTML="<table><tr><th>Тема</th><th>Верно</th><th>Всего</th></tr>"+
 Object.entries(by).map(([t,x])=>`<tr><td>${t}</td><td>${x.n}</td><td>${x.total}</td></tr>`).join("")+"</table>";
 const weakest=Object.entries(by).sort((a,b)=>a[1].n/a[1].total-b[1].n/b[1].total)[0];
 $("stats").innerHTML+=`<p><b>Тема для повторения:</b> ${weakest[0]}.</p>`;
 $("review").innerHTML=questions.map((q,i)=>{
  const got=(answers[i]||[]).map(n=>q.o[n]).join("; ")||"Ответ не выбран";
  const key=q.a.map(n=>q.o[n]).join("; ");
  const ok=(answers[i]||[]).length===q.a.length&&q.a.every(n=>(answers[i]||[]).includes(n));
  return `<div class="explain"><b class="${ok?"correct":"wrong"}">${ok?"Верно":"Ошибка"} · ${q.t}</b><br><b>Задание:</b> ${q.q}<br><b>Ваш ответ:</b> ${got}<br><b>Правильный ответ:</b> ${key}<br>${q.e}</div>`
 }).join("");
}
render();
</script>
