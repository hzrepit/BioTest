<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Интерактивный тест: химический состав и органоиды клетки</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7f5;color:#1f2933;margin:0}header{background:#176b50;color:white;padding:24px;text-align:center}main{max-width:980px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 9px #00000015}.q-title{font-weight:700;font-size:18px;margin-bottom:12px}.hint{color:#52606d;font-size:14px;margin:8px 0 14px}label.option{display:block;border:1px solid #d7e1dc;border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}label.option:hover{background:#eef8f3}.correct{background:#d8f4df!important;border-color:#1c8b47!important}.wrong{background:#ffe0e0!important;border-color:#c93333!important}button{background:#176b50;color:white;border:0;border-radius:8px;padding:13px 20px;font-size:16px;cursor:pointer;margin:8px 4px 8px 0}#result{font-size:20px;font-weight:bold;padding:18px;background:#e7f6ed;border-radius:10px;margin:18px 0}.explanation{display:none;margin-top:10px;padding:10px;background:#f5f8fa;border-left:4px solid #176b50}svg{max-width:100%;height:auto;background:#fbfffd;border:1px solid #cbd8d1;border-radius:10px;margin:10px 0}.legend{font-size:14px;color:#455}.hidden{display:none}
</style>
</head>
<body>
<header><h1>Тест: химический состав и органоиды клетки</h1><p>50 заданий для 9–11 классов</p></header>
<main>
<div class="card"><b>Инструкция.</b> В заданиях с одним ответом выберите один вариант. В заданиях «Выберите все верные ответы» можно отметить несколько вариантов. Порядок вопросов и вариантов ответов меняется при каждом новом запуске теста.</div>
<div id="test"></div><button id="checkBtn">Проверить тест</button><button onclick="location.reload()">Пройти ещё раз</button><div id="result" class="hidden"></div>
</main>

["one","Какие вещества относят к нуклеиновым кислотам?",["ДНК и РНК","белки и жиры","вода и соли","глюкоза и крахмал"],[0],"К нуклеиновым кислотам относятся ДНК и РНК."],

["one","Какой углевод образует клеточную стенку растений?",["целлюлоза","гликоген","лактоза","сахароза"],[0],"Клеточная стенка растений образована целлюлозой."],

["multi","Выберите все верные ответы. К органоидам клетки относятся:",["митохондрии","рибосомы","вода","хлоропласты"],[0,1,3],"Вода — вещество клетки, но не органоид."],
["multi","Выберите все верные ответы. Функции белков:",["ферментативная","строительная","защитная","хранение наследственной информации"],[0,1,2],"Наследственную информацию хранит ДНК."],
["multi","Выберите все верные ответы. Признаки растительной клетки:",["клеточная стенка","хлоропласты","крупная вакуоль","клеточный центр как основной органоид деления"],[0,1,2],"Для растительных клеток характерны стенка, пластиды и крупная вакуоль."],
["multi","Выберите все верные ответы. К неорганическим веществам клетки относят:",["воду","минеральные соли","белки","кислород"],[0,1,3],"Белки — органические вещества."],
["multi","Выберите все верные ответы. Митохондрии:",["участвуют в клеточном дыхании","синтезируют АТФ","имеют две мембраны","осуществляют фотосинтез"],[0,1,2],"Фотосинтез происходит в хлоропластах."],
["multi","Выберите все верные ответы. К функциям воды в клетке относят:",["растворение веществ","участие в реакциях","поддержание формы клетки","хранение генетического кода"],[0,1,2],"Генетический код хранится в ДНК."],
["multi","Выберите все верные ответы. В состав нуклеотида ДНК входят:",["азотистое основание","сахар дезоксирибоза","остаток фосфорной кислоты","аминокислота"],[0,1,2],"Аминокислоты являются мономерами белков."],
["multi","Выберите все верные ответы. Липиды:",["входят в состав мембран","служат запасом энергии","могут выполнять защитную функцию","являются мономерами белков"],[0,1,2],"Мономеры белка — аминокислоты."],
["multi","Выберите все верные ответы. В ядре клетки находятся:",["хроматин","ядрышко","ядерная оболочка","клеточная стенка"],[0,1,2],"Клеточная стенка находится снаружи мембраны растительной клетки."],
["multi","Выберите все верные ответы. Рибосомы:",["не имеют мембраны","участвуют в синтезе белка","есть у прокариот и эукариот","осуществляют внутриклеточное пищеварение"],[0,1,2],"Внутриклеточное пищеварение связано с лизосомами."],
["one","Рассмотрите рисунок растительной клетки. Какая структура обозначена буквой В?",["вакуоль","ядро","хлоропласт","митохондрия"],[0],"Буква В находится в большой центральной вакуоли.","plant"],
["one","Рассмотрите рисунок растительной клетки. Какая структура обозначена буквой Б?",["хлоропласт","ядро","рибосома","комплекс Гольджи"],[0],"Буква Б указывает на зелёный хлоропласт.","plant"],
["one","Рассмотрите рисунок растительной клетки. Какая структура обозначена буквой Г?",["ядро","клеточная стенка","вакуоль","митохондрия"],[0],"Буква Г расположена на ядре.","plant"],
["one","Рассмотрите рисунок животной клетки. Какая структура обозначена буквой В?",["митохондрия","ядро","клеточная мембрана","рибосома"],[0],"Буква В указывает на митохондрию.","animal"],
["one","Рассмотрите рисунок животной клетки. Какая структура обозначена буквой А?",["клеточная мембрана","ядро","лизосома","вакуоль"],[0],"Буква А расположена на наружной границе клетки.","animal"],
["one","Рассмотрите рисунок животной клетки. Какая структура обозначена буквой Б?",["ядро","митохондрия","рибосома","клеточная стенка"],[0],"Буква Б указывает на ядро.","animal"],
["one","Рассмотрите рисунок ядра. Какая структура обозначена буквой Б?",["ядрышко","ядерная оболочка","хроматин","ядерная пора"],[0],"Буква Б указывает на плотное округлое ядрышко.","nucleus"],
["one","Рассмотрите рисунок ядра. Какая структура обозначена буквой В?",["хроматин","ядрышко","клеточная мембрана","вакуоль"],[0],"Буква В указывает на нити хроматина.","nucleus"],
["one","Рассмотрите рисунок ядра. Какая структура обозначена буквой Г?",["ядерная оболочка","рибосома","хлоропласт","лизосома"],[0],"Буква Г обозначает оболочку ядра.","nucleus"],
["multi","Рассмотрите рисунок растительной клетки. Выберите структуры, характерные для растительных клеток:",["А — клеточная стенка","Б — хлоропласт","В — крупная вакуоль","Г — ядро есть только у растений"],[0,1,2],"Ядро имеется и у растительных, и у животных клеток.","plant"],
["multi","Рассмотрите рисунок животной клетки. Выберите верные утверждения:",["Б — ядро хранит ДНК","В — митохондрия участвует в синтезе АТФ","А — мембрана регулирует транспорт веществ","Г — структура осуществляет фотосинтез"],[0,1,2],"В животной клетке фотосинтез не происходит.","animal"],
["multi","Рассмотрите рисунок ядра. Выберите верные утверждения:",["Б — ядрышко участвует в образовании рибосом","В — хроматин содержит ДНК","Г — ядерная оболочка отделяет ядро от цитоплазмы","А — клеточная стенка ядра"],[0,1,2],"У ядра есть ядерная оболочка, а не клеточная стенка."],
["one","Какой органоид на схеме растительной клетки обозначен буквой Д?",["митохондрия","хлоропласт","ядро","вакуоль"],[0],"Буква Д указывает на митохондрию.","plant"],

];
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
const questions=shuffle(Q);
function render(){
 const box=document.getElementById("test");box.innerHTML="";
 questions.forEach((q,n)=>{
  const [type,txt,opts,correct,exp,diagram]=q;
  const card=document.createElement("section");card.className="card";card.dataset.correct=JSON.stringify(correct);
  card.innerHTML=`<div class="q-title">${n+1}. ${txt}</div><div class="hint">${type==="multi"?"Выберите все верные ответы.":"Выберите один правильный ответ."}</div>${diagram?diagrams[diagram]:""}`;
  shuffle(opts.map((t,i)=>({t,i}))).forEach((o,k)=>{
   const label=document.createElement("label");label.className="option";label.dataset.original=o.i;
   const input=document.createElement("input");input.type=type==="multi"?"checkbox":"radio";input.name="q"+n;input.value=o.i;
   label.appendChild(input);label.appendChild(document.createTextNode(" "+String.fromCharCode(1072+k)+") "+o.t));card.appendChild(label);
  });
  const expl=document.createElement("div");expl.className="explanation";const b=document.createElement("b");b.textContent="Пояснение: ";expl.appendChild(b);expl.appendChild(document.createTextNode(exp));card.appendChild(expl);box.appendChild(card);
 });
}
document.getElementById("checkBtn").onclick=()=>{
 let score=0;
 document.querySelectorAll(".card[data-correct]").forEach(card=>{
  const correct=JSON.parse(card.dataset.correct).slice().sort((a,b)=>a-b);
  const selected=[...card.querySelectorAll("input:checked")].map(x=>+x.value).sort((a,b)=>a-b);
  if(selected.length===correct.length&&selected.every((v,i)=>v===correct[i]))score++;
  card.querySelectorAll("label.option").forEach(l=>{const id=+l.dataset.original;if(correct.includes(id))l.classList.add("correct");if(l.querySelector("input").checked&&!correct.includes(id))l.classList.add("wrong");l.querySelector("input").disabled=true});
  card.querySelector(".explanation").style.display="block";
 });
 const r=document.getElementById("result");r.classList.remove("hidden");r.textContent=`Результат: ${score} из ${questions.length}. ${score>=40?"Отличный результат!":score>=30?"Хороший результат.":"Повторите темы и пройдите тест ещё раз."}`;
 document.getElementById("checkBtn").disabled=true;window.scrollTo({top:0,behavior:"smooth"});
};
render();
</script>
</body>
